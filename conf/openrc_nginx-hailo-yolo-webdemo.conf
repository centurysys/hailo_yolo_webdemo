server {
    listen 80;
    server_name _;

    client_max_body_size 512M;
    client_body_temp_path /var/tmp/hailo-demo/upload;
    client_body_in_file_only clean;
    client_body_buffer_size 128k;

    location /upload {
        proxy_pass http://127.0.0.1:18080;

        proxy_request_buffering on;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-FILE $request_body_file;
    }

    # Generated MP4 playback path.
    # This is served directly by nginx so browser <video> seeking can use
    # HTTP Range requests.  The application-side /files/<job-id> route remains
    # available for downloads and image results.
    location ~ ^/job-media/([A-Za-z0-9_-]+)/output\.mp4$ {
        alias /var/tmp/hailo-demo/jobs/$1/output.mp4;
        default_type video/mp4;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
